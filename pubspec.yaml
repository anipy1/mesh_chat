name: mesh_chat
description: "A BLE mesh messenger, built from scratch in Flutter."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  bluetooth_low_energy: ^6.2.1
  cryptography: ^2.9.0
  # Pinned to 9.x on purpose. 10.x and later build against compileSdk 37, and
  # the android-37 platform this machine installed reports its api level as
  # "37.0" rather than an integer, so Gradle cannot resolve it and the build
  # fails inside the plugin. Nothing in our code needs the newer API. Worth
  # retrying once the SDK ships that platform with sane metadata.
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
